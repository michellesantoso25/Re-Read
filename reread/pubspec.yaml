name: reread
description: "Re:Read marketplace for buying and selling pre-loved books."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  file_picker: ^10.3.3
  flutter_dotenv: ^6.0.1
  flutter_web_plugins:
    sdk: flutter
  google_fonts: ^8.2.1
  url_launcher: ^6.3.3
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - lib/assets/about_hero.jpg
    - lib/assets/logo.png
    - lib/assets/logo2.png
    - lib/assets/sell_hero.jpg
    - lib/assets/covers/
